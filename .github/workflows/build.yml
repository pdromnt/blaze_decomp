name: Native builds
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  pull_request:
    paths-ignore: ['**/*.md']
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        type: string
        required: true
      package_version:
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && github.event_name != 'workflow_call' }}
jobs:
  build:
    name: SDL3 ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x86
            runner: windows-2022
            architecture: x86
            video: windows
          - platform: windows-x64
            runner: windows-2022
            architecture: x64
            video: windows
          - platform: windows-arm64
            runner: windows-11-arm
            architecture: ARM64
            video: windows
          - platform: linux-x64
            runner: ubuntu-24.04
            video: dummy
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            video: dummy
          - platform: macos-arm64
            runner: macos-15
            video: dummy
    env:
      SDL_VIDEODRIVER: ${{ matrix.video }}
      SDL_RENDER_DRIVER: software
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build pkg-config libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev libwayland-dev libxkbcommon-dev libasound2-dev libpulse-dev libudev-dev libdrm-dev libgbm-dev libegl1-mesa-dev libgl1-mesa-dev
      - name: Build and check Windows SDL application
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./source/scripts/build.ps1 -Architecture '${{ matrix.architecture }}' -Backend SDL3 -Configuration Release -Tests -NoDeploy
      - name: Build and check Unix SDL application
        if: runner.os != 'Windows'
        run: |
          cmake -S source -B source/build/sdl-native -DCMAKE_BUILD_TYPE=Release -DBLAZE_PLATFORM=SDL3 -DBLAZE_BUILD_APPLICATION=ON -DBUILD_TESTING=ON
          cmake --build source/build/sdl-native --parallel 3
          ctest --test-dir source/build/sdl-native --output-on-failure
      - name: Stage runtime
        shell: pwsh
        run: |
          $build=if($IsWindows){'source/build/windows-${{ matrix.architecture }}-sdl3'.ToLowerInvariant()}else{'source/build/sdl-native'}
          cmake --install $build --config Release --prefix source/build/stage --component Runtime
          if($LASTEXITCODE){throw 'Runtime installation failed.'}
      - name: Check Unix shared library lookup
        if: runner.os != 'Windows'
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            readelf -d source/build/stage/blaze | grep -F '$ORIGIN'
            ldd source/build/stage/blaze | grep 'libfluidsynth.so.3 => .*/stage/.*libfluidsynth'
          else
            otool -L source/build/stage/Blaze.app/Contents/MacOS/Blaze | grep -F '@rpath/libfluidsynth.3.dylib'
            otool -l source/build/stage/Blaze.app/Contents/MacOS/Blaze | grep -F '@executable_path/../Frameworks'
          fi
      - name: Run menu, combat, pause and repeated abort route
        timeout-minutes: 2
        shell: pwsh
        env:
          SDL_AUDIODRIVER: dummy
        run: |
          $binary=if($IsWindows){'blaze.exe'}elseif($IsMacOS){'Blaze.app/Contents/MacOS/Blaze'}else{'blaze'}
          $exe=(Resolve-Path "source/build/stage/$binary").Path
          $input=(Resolve-Path source/tests/fixtures/menu-combat.input).Path
          $dump=Join-Path $env:RUNNER_TEMP 'blaze-final.ppm'
          $start=@{FilePath=$exe;ArgumentList=@('--hidden','--audio','--frames','901','--seed','1','--settings','none','--input-script',$input,'--dump-frame',$dump);WorkingDirectory=$env:RUNNER_TEMP;PassThru=$true}
          if($IsWindows){$start.WindowStyle='Hidden'}
          $process=Start-Process @start
          try {
            if(!$process.WaitForExit(55000)){throw 'Gameplay route timed out.'}
            if($process.ExitCode -ne 0){throw "Gameplay route exited $($process.ExitCode)."}
          } finally {
            if(!$process.HasExited){$process.Kill();$process.WaitForExit()}
            $process.Dispose()
          }
          if((Get-FileHash $dump).Hash -ne 'B83704A703B65E2A39367262C04DD306BBB7068C9480E65FF028039EBB9ACB3C'){throw 'Gameplay frame differs from the Windows reference.'}
      - name: Package runtime and verify architecture
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ inputs.package_version || 'snapshot' }}
        run: ./source/scripts/package-release.ps1 -Version $env:PACKAGE_VERSION -Platform '${{ matrix.platform }}' -StageDirectory source/build/stage
      - name: Launch extracted archive or mounted DMG
        shell: pwsh
        env:
          SDL_AUDIODRIVER: dummy
        run: ./source/scripts/check-package.ps1 -Platform '${{ matrix.platform }}'
      - uses: actions/upload-artifact@v7
        with:
          name: runtime-${{ matrix.platform }}
          path: source/dist/*
          if-no-files-found: error
          retention-days: 14
      - name: Record build provenance
        shell: pwsh
        run: |
          "### ${{ matrix.platform }}" >> $env:GITHUB_STEP_SUMMARY
          "Commit: $(git rev-parse HEAD)" >> $env:GITHUB_STEP_SUMMARY
          "Release build, native checks, deterministic gameplay frame and packaged launch passed. Hardware acceptance remains manual; see TESTING.md." >> $env:GITHUB_STEP_SUMMARY
  comparison:
    name: Win32 comparison
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - name: Preserve Win32 application and checks
        shell: pwsh
        run: ./source/scripts/build.ps1 -Architecture x64 -Configuration Release -Tests -NoDeploy
